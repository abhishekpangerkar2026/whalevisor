set timeout=8
set default=0

serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

insmod all_video
insmod gfxterm

menuentry "Try WhaleVisor @VERSION@ without installing" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 quiet
    initrd /boot/initramfs.gz
}

menuentry "Try WhaleVisor @VERSION@ (show boot messages)" {
    linux /boot/vmlinuz console=ttyS0,115200 console=tty0
    initrd /boot/initramfs.gz
}

menuentry "Boot from the existing disk" {
    exit
}
