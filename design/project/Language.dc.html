<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WhaleVisor installer language and keyboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap">
<style>
body{margin:0}
a{color:#002DA1}a:hover{color:#001F70}
</style>
</helmet>
<div style="width: 1024px; height: 768px; box-sizing: border-box; padding: 40px 48px; background: #0F1E2E; color: #14202B; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; justify-content: space-between; align-items: center; color: #FFFFFF">
<div style="display: flex; align-items: center; gap: 20px">
<img src="/_blob/03f73bfb5d03b2513bb139d7b5f032ae" alt="BlueWhale Stack" style="width: 154px; height: 40px">
<div style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 700">WhaleVisor Installer</div>
</div>
<div style="color: #C9D3DD">Language · version 1.0</div>
</div>
<div style="flex-grow: 1; background: #FFFFFF; border-radius: 12px; padding: 32px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 28px; font-weight: 700">Language and keyboard</h1>
<div style="color: #56636F">You can change these later in the console.</div>
</div>
<form style="margin: 0; display: flex; flex-direction: column; gap: 20px"><fieldset style="margin: 0; padding: 0; border: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<legend style="padding: 0; margin-bottom: 12px; font-weight: 600">Language</legend>
<label style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border: 2px solid {{accent}}; border-radius: 10px">
<input type="radio" name="lang" value="en" checked style="margin-top: 3px">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">English</span><span style="color: #56636F">Default</span></span>
</label><label style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border: 1px solid #8A96A3; border-radius: 10px">
<input type="radio" name="lang" value="hi" style="margin-top: 3px">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">हिन्दी</span><span style="color: #56636F">Hindi</span></span>
</label><label style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border: 1px solid #8A96A3; border-radius: 10px">
<input type="radio" name="lang" value="ar" style="margin-top: 3px">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">العربية</span><span style="color: #56636F">Arabic</span></span>
</label><label style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border: 1px solid #8A96A3; border-radius: 10px">
<input type="radio" name="lang" value="fr" style="margin-top: 3px">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Français</span><span style="color: #56636F">French</span></span>
</label>
</fieldset>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 6px">
<label for="kb" style="font-weight: 600">Keyboard layout</label>
<select id="kb" style="box-sizing: border-box; width: 100%; height: 44px; padding: 0 12px; border: 1px solid #8A96A3; border-radius: 8px; font: inherit; color: #14202B; background: #FFFFFF"><option>English (US)</option><option>English (UK)</option><option>English (India)</option><option>Arabic</option></select>
</div>
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 6px">
<label for="tz" style="font-weight: 600">Time zone</label>
<select id="tz" style="box-sizing: border-box; width: 100%; height: 44px; padding: 0 12px; border: 1px solid #8A96A3; border-radius: 8px; font: inherit; color: #14202B; background: #FFFFFF"><option>Asia/Kolkata</option><option>Asia/Dubai</option><option>UTC</option></select>
</div>
</div></form>
<div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center"><a href="Welcome.dc.html" style="display: inline-block; padding: 11px 20px; border-radius: 8px; text-decoration: none; border: 1px solid #8A96A3; color: #14202B; font-weight: 600">Back</a><a href="Licence.dc.html" style="display: inline-block; padding: 12px 20px; border-radius: 8px; text-decoration: none; background: {{accent}}; color: #FFFFFF; font-weight: 600">Next</a></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#002DA1"},"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#002DA1' };
}
}
</script>
</body>
</html>
