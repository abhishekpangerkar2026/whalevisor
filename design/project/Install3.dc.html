<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WhaleVisor installer network and cluster</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap">
<style>
body{margin:0}
a{color:#002DA1}a:hover{color:#001F70}
</style>
</helmet>
<div style="width: 1024px; height: 768px; box-sizing: border-box; padding: 40px 48px; background: #0F1E2E; color: #14202B; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; justify-content: space-between; align-items: center; color: #FFFFFF">
<div style="display: flex; align-items: center; gap: 20px">
<img src="/_blob/03f73bfb5d03b2513bb139d7b5f032ae" alt="BlueWhale Stack" style="width: 154px; height: 40px">
<div style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 700">WhaleVisor Installer</div>
</div>
<div style="color: #C9D3DD">Step 3 of 5 · version 1.0</div>
</div>
<form style="flex-grow: 1; margin: 0; background: #FFFFFF; border-radius: 12px; padding: 32px; display: flex; flex-direction: column; gap: 20px">
<h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 28px; font-weight: 700">Network and cluster</h1>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="hostname" style="font-weight: 600">Server name</label>
<input id="hostname" type="text" value="host-01" style="box-sizing: border-box; width: 100%; height: 44px; padding: 0 12px; border: 1px solid #8A96A3; border-radius: 8px; font: inherit; color: #14202B">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="port" style="font-weight: 600">Management port</label>
<select id="port" style="height: 44px; padding: 0 12px; border: 1px solid #8A96A3; border-radius: 8px; font: inherit; color: #14202B; background: #FFFFFF">
<option>Port 1 (25 GbE, connected)</option>
<option>Port 2 (25 GbE, connected)</option>
</select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ip" style="font-weight: 600">IP address</label>
<input id="ip" type="text" value="10.20.0.21/24" style="box-sizing: border-box; width: 100%; height: 44px; padding: 0 12px; border: 1px solid #8A96A3; border-radius: 8px; font: inherit; color: #14202B">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="gw" style="font-weight: 600">Gateway</label>
<input id="gw" type="text" value="10.20.0.1" style="box-sizing: border-box; width: 100%; height: 44px; padding: 0 12px; border: 1px solid #8A96A3; border-radius: 8px; font: inherit; color: #14202B">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="pw" style="font-weight: 600">Administrator password</label>
<input id="pw" type="password" value="samplepassword" style="box-sizing: border-box; width: 100%; height: 44px; padding: 0 12px; border: 1px solid #8A96A3; border-radius: 8px; font: inherit; color: #14202B">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="pw2" style="font-weight: 600">Repeat password</label>
<input id="pw2" type="password" value="samplepassword" style="box-sizing: border-box; width: 100%; height: 44px; padding: 0 12px; border: 1px solid #8A96A3; border-radius: 8px; font: inherit; color: #14202B">
</div>
</div>
<fieldset style="margin: 0; padding: 0; border: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 24px">
<legend style="padding: 0; margin-bottom: 12px; font-weight: 600">Cluster</legend>
<label style="display: flex; gap: 12px; align-items: flex-start; padding: 16px; border: 2px solid {{accent}}; border-radius: 10px">
<input type="radio" name="cluster" value="new" checked style="margin-top: 4px">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Start a new cluster</span><span style="color: #56636F">This is the first WhaleVisor server.</span></span>
</label>
<label style="display: flex; gap: 12px; align-items: flex-start; padding: 16px; border: 1px solid #8A96A3; border-radius: 10px">
<input type="radio" name="cluster" value="join" style="margin-top: 4px">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600"><a href="Install3Join.dc.html">Join an existing cluster</a></span><span style="color: #56636F">Enter a join code from WhaleVisor Console.</span></span>
</label>
</fieldset>
<div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center">
<a href="Install2.dc.html" style="display: inline-block; padding: 11px 20px; border-radius: 8px; text-decoration: none; border: 1px solid #8A96A3; color: #14202B; font-weight: 600">Back</a>
<a href="Install4.dc.html" style="display: inline-block; padding: 12px 24px; border-radius: 8px; text-decoration: none; background: {{accent}}; color: #FFFFFF; font-weight: 600">Next: AI assistant</a>
</div>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#002DA1"},"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#002DA1' };
}
}
</script>
</body>
</html>
