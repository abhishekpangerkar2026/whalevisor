<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WhaleVisor installer AI assistant</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap">
<style>
body{margin:0}
a{color:#002DA1}a:hover{color:#001F70}
</style>
</helmet>
<div style="width: 1024px; height: 768px; box-sizing: border-box; padding: 40px 48px; background: #0F1E2E; color: #14202B; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; justify-content: space-between; align-items: center; color: #FFFFFF">
<div style="display: flex; align-items: center; gap: 20px">
<img src="/_blob/03f73bfb5d03b2513bb139d7b5f032ae" alt="BlueWhale Stack" style="width: 154px; height: 40px">
<div style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 700">WhaleVisor Installer</div>
</div>
<div style="color: #C9D3DD">Step 4 of 5 · version 1.0</div>
</div>
<form style="flex-grow: 1; margin: 0; background: #FFFFFF; border-radius: 12px; padding: 32px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 28px; font-weight: 700">AI assistant (optional)</h1>
<div style="color: #56636F">Forecasting and automatic balancing always run on this cluster. This choice is only for the Whale AI assistant, and you can change it later.</div>
</div>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0; margin-bottom: 10px; font-weight: 600">Language model for Whale AI</legend>
<label style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border: 2px solid {{accent}}; border-radius: 10px">
<input type="radio" name="llm" value="later" checked style="margin-top: 4px">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Decide later</span><span style="color: #56636F">The assistant stays off until you set it up in WhaleVisor Console.</span></span>
</label>
<label style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border: 1px solid #8A96A3; border-radius: 10px">
<input type="radio" name="llm" value="local" style="margin-top: 4px">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Local model on this cluster</span><span style="color: #56636F">Nothing leaves your site. Needs one GPU.</span></span>
</label>
<label style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border: 1px solid #8A96A3; border-radius: 10px">
<input type="radio" name="llm" value="cloud" style="margin-top: 4px">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Cloud provider with your own API key</span><span style="color: #56636F">Claude, OpenAI, Gemini or another. Questions and masked metrics are sent to that provider.</span></span>
</label>
<label style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border: 1px solid #8A96A3; border-radius: 10px">
<input type="radio" name="llm" value="own" style="margin-top: 4px">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Your own model endpoint</span><span style="color: #56636F">A model your organisation already hosts.</span></span>
</label>
<label style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border: 1px solid #8A96A3; border-radius: 10px">
<input type="radio" name="llm" value="off" style="margin-top: 4px">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">No assistant</span><span style="color: #56636F">WhaleVisor works fully without it.</span></span>
</label>
</fieldset>
<div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center">
<a href="Install3.dc.html" style="display: inline-block; padding: 11px 20px; border-radius: 8px; text-decoration: none; border: 1px solid #8A96A3; color: #14202B; font-weight: 600">Back</a>
<a href="Installing.dc.html" style="display: inline-block; padding: 12px 24px; border-radius: 8px; text-decoration: none; background: {{accent}}; color: #FFFFFF; font-weight: 600">Install WhaleVisor</a>
</div>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#002DA1"},"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#002DA1' };
}
}
</script>
</body>
</html>
